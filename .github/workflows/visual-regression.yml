name: Visual regression

# Vercel posts a deployment_status event when a preview is ready; we screenshot that
# exact deployment and diff it against the baselines committed in tests/visual/__snapshots__.
on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  visual:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run visual tests
        id: pw
        continue-on-error: true
        run: npx playwright test
      - name: Upload report (diffs on failure)
        if: steps.pw.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.pw.outcome }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          SHA: ${{ github.event.deployment.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: process.env.SHA,
            });
            const pr = prs.find((p) => p.state === 'open');
            if (!pr) return core.info('No open PR for this commit; skipping comment.');

            const passed = process.env.RESULT === 'success';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const marker = '<!-- visual-regression -->';
            const body = [
              marker,
              `### ${passed ? '✅' : '❌'} Visual regression: ${passed ? 'no changes' : 'differences found'}`,
              '',
              `Preview: ${process.env.PREVIEW_URL}`,
              `Commit: \`${process.env.SHA.slice(0, 7)}\``,
              '',
              passed
                ? 'All pages match their baselines.'
                : `Download the **playwright-report** artifact from the [workflow run](${runUrl}) to see expected / actual / diff images. If the change is intentional, run the "Update visual baselines" workflow.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
      - name: Fail if visual tests failed
        if: steps.pw.outcome == 'failure'
        run: exit 1
