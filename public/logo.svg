<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zak ElSeht logo">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7f7"/>
      <stop offset="1" stop-color="#3bb8cc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded hex frame -->
  <path d="M60 6 108 33 108 87 60 114 12 87 12 33Z"
        fill="#0d1117" stroke="url(#edge)" stroke-width="2.5"
        stroke-linejoin="round" opacity="0.85"/>

  <!-- node-network Z -->
  <g filter="url(#glow)" stroke="url(#edge)" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M40 42 H80 L40 78 H80"/>
  </g>

  <!-- network nodes on the Z vertices -->
  <g fill="#6ee7f7">
    <circle cx="40" cy="42" r="4.5"/>
    <circle cx="80" cy="42" r="4.5"/>
    <circle cx="40" cy="78" r="4.5"/>
    <circle cx="80" cy="78" r="4.5"/>
  </g>
</svg>
